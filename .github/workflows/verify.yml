name: Verify recovered Q-ARMOR
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.verify_project --output results/ci_verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: results/ci_verification
          if-no-files-found: warn
